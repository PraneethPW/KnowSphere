[project]
name = "knowsphere-api"
version = "1.0.0"
description = "Durable, source-grounded knowledge graph and discovery API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1",
  "pypdf>=5.3,<7", "networkx>=3.4,<4", "scipy>=1.15,<2", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowsphere*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
