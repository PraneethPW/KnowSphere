services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knowsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowsphere-local-only}
      POSTGRES_DB: knowsphere
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - knowsphere-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowsphere -d knowsphere']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  knowsphere-postgres:
